manifest_version = 1

# ---- identity ----
id          = "msdf-overlay"
name        = "MSDF Text Overlay"
version     = "1.0.0"
author      = "static"
description = "Native MSDF text renderer replacing the retro CRT ASCII mask."
license     = "MIT"
tags        = ["filter", "overlay", "msdf", "text", "signal"]

# ---- engine compatibility ----
api_min = 1
api_max = 1

# ---- kind ----
kind   = "pipeline"
runner = "native"
entry  = "runtime/linux-x86_64/libmsdf_overlay.so"

[[shaders]]
id    = "main"
path  = "shaders/msdf.wgsl"
stage = "fragment"
entry = "fs_main"

# ---- parameters ----
[params.ascii_expression]
type    = "text"
default = ">_<"
label   = "ASCII Expression"
group   = "Mask"
help    = "Single-expression mode."

[params.mask_size]
type    = "f32"
default = 0.25
min     = 0.05
max     = 1.0
label   = "Mask Size"
group   = "Mask"
help    = "Base half-size of the glyph."

[params.mirror_x]
type    = "bool"
default = true
label   = "Mirror X"
group   = "Calibration"
help    = "Flip horizontally."

[params.mirror_y]
type    = "bool"
default = false
label   = "Mirror Y"
group   = "Calibration"
help    = "Flip vertically."

[params.offset_x]
type    = "f32"
default = 0.0
min     = -2.0
max     = 2.0
label   = "Offset X"
group   = "Calibration"
help    = "Horizontal center offset."

[params.offset_y]
type    = "f32"
default = 0.0
min     = -2.0
max     = 2.0
label   = "Offset Y"
group   = "Calibration"
help    = "Vertical center offset."

[params.opacity]
type    = "f32"
default = 0.9
min     = 0.0
max     = 1.0
label   = "Opacity"
group   = "Mask"
help    = "Overlay strength."

[params.rotation_offset]
type    = "f32"
default = 0.0
min     = -3.14159
max     = 3.14159
label   = "Rotation Offset"
group   = "Calibration"
help    = "Rotation calibration in radians."

[params.scale_mul]
type    = "f32"
default = 1.0
min     = 0.0
max     = 5.0
label   = "Scale Multiplier"
group   = "Calibration"
help    = "Scale multiplier."

# ---- signals consumed ----
[[consume]]
name     = "face.position"
kind     = "vec2"
optional = true

[[consume]]
name     = "face.rotation"
kind     = "vec3"
optional = true

[[consume]]
name     = "face.scale"
kind     = "f32"
optional = true

# ---- pipeline descriptor ----
[pipeline]
renderer = "instanced"

[pipeline.instance_schema]
schema_id = 1

[[pipeline.instance_schema.fields]]
name = "position"
type = "vec2"

[[pipeline.instance_schema.fields]]
name = "uv"
type = "vec4"

[[pipeline.instance_schema.fields]]
name = "color"
type = "vec4"

[[pipeline.instance_schema.fields]]
name = "scale"
type = "float"

[[pipeline.instance_schema.fields]]
name = "rotation"
type = "float"
